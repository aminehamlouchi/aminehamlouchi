<svg width="1100" height="290" viewBox="0 0 1100 290" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="fglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="fscan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect y="2" width="4" height="1" fill="#00ff41" opacity="0.03"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="1098" height="288" rx="10" fill="#070c07" stroke="#1d2b1d" stroke-width="2"/>
  <rect x="1" y="1" width="1098" height="288" rx="10" fill="url(#fscan)"/>
  <path d="M1 34 H1099" stroke="#1d2b1d" stroke-width="1.5"/>
  <circle cx="26" cy="18" r="6" fill="#3f663f" opacity="0.9"/>
  <circle cx="48" cy="18" r="6" fill="#00c93c" opacity="0.9"/>
  <circle cx="70" cy="18" r="6" fill="#31502f"/>
  <text x="550" y="23" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#7d947d">amine@louisville: ~/fetch</text>

  <!-- eight-pointed star, slow spin -->
  <g transform="translate(150,165)">
    <g opacity="0.9">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="70s" repeatCount="indefinite"/>
      <rect x="-72" y="-72" width="144" height="144" fill="none" stroke="#00ff41" stroke-width="2.5" filter="url(#fglow)"/>
      <rect x="-72" y="-72" width="144" height="144" fill="none" stroke="#00c93c" stroke-width="2.5" transform="rotate(45)" filter="url(#fglow)"/>
    </g>
    <g opacity="0.85">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="70s" repeatCount="indefinite"/>
      <rect x="-44" y="-44" width="88" height="88" fill="none" stroke="#7d947d" stroke-width="1.5"/>
      <rect x="-44" y="-44" width="88" height="88" fill="none" stroke="#7d947d" stroke-width="1.5" transform="rotate(45)"/>
    </g>
    <text x="0" y="14" text-anchor="middle" font-family="'Geeza Pro', 'Traditional Arabic', 'Noto Naskh Arabic', serif" font-size="42" fill="#00ff41" filter="url(#fglow)">&#1571;</text>
  </g>

  <!-- fetch output -->
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16">
    <g>
      <text x="330" y="72" fill="#00ff41" font-weight="bold">amine</text>
      <text x="384" y="72" fill="#dcecdc">@</text>
      <text x="398" y="72" fill="#00ff41" font-weight="bold">louisville</text>
      <text x="330" y="92" fill="#31502f">&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;</text>
    </g>
    <g>
      <text x="330" y="118" fill="#00c93c">edu</text><text x="470" y="118" fill="#dcecdc">UofL Speed School &#183; CS '28 &#183; Arabic minor</text>
    </g>
    <g>
      <text x="330" y="142" fill="#00c93c">focus</text><text x="470" y="142" fill="#dcecdc">AI systems &#183; full-stack platforms</text>
    </g>
    <g>
      <text x="330" y="166" fill="#00c93c">founder</text><text x="470" y="166" fill="#dcecdc">rumi &#183; minbar</text>
    </g>
    <g>
      <text x="330" y="190" fill="#00c93c">intern</text><text x="470" y="190" fill="#dcecdc">Parker Hannifin &#183; IT Analyst</text>
    </g>
    <g>
      <text x="330" y="214" fill="#00c93c">speaks</text><text x="470" y="214" fill="#dcecdc">english &#183; <tspan font-family="'Geeza Pro', 'Traditional Arabic', 'Noto Naskh Arabic', serif">&#1575;&#1604;&#1593;&#1585;&#1576;&#1610;&#1577;</tspan></text>
    </g>
    <g>
      <text x="330" y="238" fill="#00c93c">status</text><text x="470" y="238" fill="#00ff41">open to SWE / AI internships</text>
    </g>
  </g>

  <!-- neofetch palette strip -->
  <g>
    <rect x="330" y="256" width="26" height="12" fill="#0d130d"/>
    <rect x="356" y="256" width="26" height="12" fill="#31502f"/>
    <rect x="382" y="256" width="26" height="12" fill="#00380f"/>
    <rect x="408" y="256" width="26" height="12" fill="#00701e"/>
    <rect x="434" y="256" width="26" height="12" fill="#00b82e"/>
    <rect x="460" y="256" width="26" height="12" fill="#00c93c"/>
    <rect x="486" y="256" width="26" height="12" fill="#00ff41"/>
    <rect x="512" y="256" width="26" height="12" fill="#dcecdc"/>
  </g>
</svg>
