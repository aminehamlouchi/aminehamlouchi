<svg width="1100" height="330" viewBox="0 0 1100 330" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="none"/>
      <rect y="2" width="4" height="1" fill="#ffb000" opacity="0.035"/>
    </pattern>
    <radialGradient id="vign" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#16130c"/>
      <stop offset="100%" stop-color="#0b0a08"/>
    </radialGradient>
  </defs>

  <!-- terminal frame -->
  <rect x="1" y="1" width="1098" height="328" rx="10" fill="url(#vign)" stroke="#262117" stroke-width="2"/>
  <rect x="1" y="1" width="1098" height="328" rx="10" fill="url(#scan)"/>

  <!-- title bar -->
  <path d="M1 34 H1099" stroke="#262117" stroke-width="1.5"/>
  <circle cx="26" cy="18" r="6" fill="#d9553b" opacity="0.9"/>
  <circle cx="48" cy="18" r="6" fill="#e8a33d" opacity="0.9"/>
  <circle cx="70" cy="18" r="6" fill="#3a3221"/>
  <text x="550" y="23" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#a6987d">amine@louisville: ~</text>

  <!-- prompt line, typed -->
  <text x="44" y="84" font-family="Consolas, 'Courier New', monospace" font-size="19" fill="#a6987d">amine@louisville:~$
    <tspan fill="#ede4d3"> <tspan opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.55s" dur="0.01s" fill="freeze"/>w</tspan><tspan opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.70s" dur="0.01s" fill="freeze"/>h</tspan><tspan opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.85s" dur="0.01s" fill="freeze"/>o</tspan><tspan opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.97s" dur="0.01s" fill="freeze"/>a</tspan><tspan opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.09s" dur="0.01s" fill="freeze"/>m</tspan><tspan opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.21s" dur="0.01s" fill="freeze"/>i</tspan></tspan>
  </text>
  <!-- typing cursor that stops -->
  <rect x="348" y="70" width="10" height="18" fill="#ffb000" opacity="0">
    <animate attributeName="opacity" values="0;1;0;1;0;1;0" begin="0s" dur="1.4s" fill="freeze"/>
  </rect>

  <!-- name -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.6s" dur="0.5s" fill="freeze"/>
    <text x="42" y="172" font-family="Consolas, 'Courier New', monospace" font-size="64" font-weight="bold" fill="#ffb000" filter="url(#glow)" letter-spacing="2">AMINE HAMLOUCHI</text>
    <text x="1058" y="120" text-anchor="end" font-family="'Geeza Pro', 'Traditional Arabic', 'Noto Naskh Arabic', serif" font-size="38" fill="#e8a33d" filter="url(#softglow)" opacity="0.95">&#1571;&#1605;&#1610;&#1606; &#1581;&#1605;&#1604;&#1608;&#1588;&#1610;</text>
  </g>

  <!-- tagline -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.1s" dur="0.5s" fill="freeze"/>
    <text x="44" y="216" font-family="Consolas, 'Courier New', monospace" font-size="18" fill="#a6987d">// computer science @ university of louisville &#183; building AI systems &amp; full-stack platforms</text>
  </g>

  <!-- status line -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.5s" dur="0.5s" fill="freeze"/>
    <text x="44" y="266" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#ede4d3">[<tspan fill="#ffb000">founder</tspan>] rumi &#183; minbar<tspan dx="30">[</tspan><tspan fill="#ffb000">intern</tspan>] parker hannifin<tspan dx="30">[</tspan><tspan fill="#ffb000">class of</tspan>] 2028</text>
  </g>

  <!-- final prompt with blinking cursor -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.9s" dur="0.3s" fill="freeze"/>
    <text x="44" y="304" font-family="Consolas, 'Courier New', monospace" font-size="17" fill="#a6987d">amine@louisville:~$</text>
    <rect x="248" y="290" width="10" height="17" fill="#ffb000">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" begin="3.0s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
