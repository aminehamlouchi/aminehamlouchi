<svg width="1100" height="330" viewBox="0 0 1100 330" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="none"/>
      <rect y="2" width="4" height="1" fill="#00ff41" opacity="0.035"/>
    </pattern>
    <radialGradient id="vign" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#0d130d"/>
      <stop offset="100%" stop-color="#070c07"/>
    </radialGradient>
  </defs>

  <!-- terminal frame -->
  <rect x="1" y="1" width="1098" height="328" rx="10" fill="url(#vign)" stroke="#1d2b1d" stroke-width="2"/>
  <rect x="1" y="1" width="1098" height="328" rx="10" fill="url(#scan)"/>

  <!-- title bar -->
  <path d="M1 34 H1099" stroke="#1d2b1d" stroke-width="1.5"/>
  <circle cx="26" cy="18" r="6" fill="#3f663f" opacity="0.9"/>
  <circle cx="48" cy="18" r="6" fill="#00c93c" opacity="0.9"/>
  <circle cx="70" cy="18" r="6" fill="#31502f"/>
  <text x="550" y="23" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#7d947d">amine@louisville: ~</text>

  <!-- prompt line, typed -->
  <text x="44" y="84" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#7d947d">amine@louisville:~$
    <tspan fill="#dcecdc"> <tspan>w</tspan><tspan>h</tspan><tspan>o</tspan><tspan>a</tspan><tspan>m</tspan><tspan>i</tspan></tspan>
  </text>
  

  <!-- name -->
  <g>
    
    <text x="42" y="172" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="64" font-weight="bold" fill="#00ff41" filter="url(#glow)" letter-spacing="2">AMINE HAMLOUCHI</text>
    <text x="1058" y="120" text-anchor="end" font-family="'Geeza Pro', 'Traditional Arabic', 'Noto Naskh Arabic', serif" font-size="38" fill="#00c93c" filter="url(#softglow)" opacity="0.95">&#1571;&#1605;&#1610;&#1606; &#1581;&#1605;&#1604;&#1608;&#1588;&#1610;</text>
  </g>

  <!-- tagline -->
  <g>
    
    <text x="44" y="216" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#7d947d">// computer science @ university of louisville &#183; building AI systems &amp; full-stack platforms</text>
  </g>

  <!-- status line -->
  <g>
    
    <text x="44" y="266" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#dcecdc">[<tspan fill="#00ff41">founder</tspan>] rumi &#183; minbar<tspan dx="30">[</tspan><tspan fill="#00ff41">intern</tspan>] parker hannifin<tspan dx="30">[</tspan><tspan fill="#00ff41">class of</tspan>] 2028</text>
  </g>

  <!-- final prompt with blinking cursor -->
  <g>
    
    <text x="44" y="304" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#7d947d">amine@louisville:~$</text>
    <rect x="212" y="290" width="10" height="17" fill="#00ff41">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" begin="0s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
